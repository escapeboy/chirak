name: worker-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # PRs build the image without pushing, so action bumps and Dockerfile changes are tested.
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/escapeboy/chirak-worker

jobs:
  build:
    # Self-hosted only: GitHub-hosted runners are not used for this repo.
    # The repo is public, so PRs from forks never run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      # The ROCm base image is tens of GB. The runner host is shared, so nothing is deleted here:
      # the build runs in a throwaway buildx builder that setup-buildx removes after the job.
      - name: Check free disk space
        run: |
          avail_gb=$(df -P --block-size=1G "$RUNNER_WORKSPACE" | awk 'NR==2 {print $4}')
          echo "${avail_gb}G free"
          if [ "$avail_gb" -lt 80 ]; then
            echo "::error::Only ${avail_gb}G free, the worker image build needs about 80G."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
