name: worker-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # PRs build the image without pushing, so action bumps and Dockerfile changes are tested.
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/escapeboy/chirak-worker

jobs:
  build:
    # Self-hosted only: GitHub-hosted runners are not used for this repo.
    # The repo is public, so PRs from forks never run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      # The ROCm base image is tens of GB. The runner host is shared, so nothing is deleted here:
      # the build runs in a throwaway buildx builder that setup-buildx removes after the job.
      - name: Check free disk space
        run: |
          avail_gb=$(df -P --block-size=1G "$RUNNER_WORKSPACE" | awk 'NR==2 {print $4}')
          echo "${avail_gb}G free"
          if [ "$avail_gb" -lt 80 ]; then
            echo "::error::Only ${avail_gb}G free, the worker image build needs about 80G."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
