services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: chirak
      MARIADB_USER: chirak
      MARIADB_PASSWORD: chirak
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:33071:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:63801:6379"

volumes:
  mariadb-data:
