# Vhost for the shared nginx-proxy on fleetq-01 (compose project `nginx`, /var/docker/nginx).
# Copy into the proxy's conf.d, attach the proxy to the external network `chirak_proxy`, nginx -t, reload.
# TLS: Cloudflare origin certificate for *.fleetq.net, already on the proxy.

server {
    listen 80;
    listen [::]:80;
    server_name chirak.fleetq.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chirak.fleetq.net;

    ssl_certificate     /etc/nginx/certs/fleetq.net.crt;
    ssl_certificate_key /etc/nginx/certs/fleetq.net.key;

    client_max_body_size 2m;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Resolve per request so recreating chirak-web does not leave a stale IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $up http://chirak-web:80;
        proxy_pass $up$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # A CPU playground answer (base + adapter) takes a few seconds; Cloudflare cuts at 100 s.
        proxy_read_timeout 100s;
    }
}
